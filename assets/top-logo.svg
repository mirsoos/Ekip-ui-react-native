<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 270" width="100%" height="100%" preserveAspectRatio="xMinYMid meet">
  <defs>
    <!-- گرادیان رنگ اصلی -->
    <linearGradient id="blueGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#006cdb"/>
      <stop offset="35%" stop-color="#007fe8"/>
      <stop offset="70%" stop-color="#0096f5"/>
      <stop offset="100%" stop-color="#00a6ff"/>
    </linearGradient>

    <!-- هایلایت و برجستگی لبه سهبعدی -->
    <linearGradient id="blueBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.45)"/>
      <stop offset="100%" stop-color="rgba(0,60,150,0.5)"/>
    </linearGradient>
  </defs>

  <path d="M 165 4
           H 885
           A 110 110 0 0 1 885 224
           H 165
           C 80 224, 30 248, 2 266
           L 2 110
           C 2 50, 75 4, 165 4 Z"
        fill="url(#blueGrad)"
        stroke="url(#blueBorder)"
        stroke-width="1.5" />
</svg>
