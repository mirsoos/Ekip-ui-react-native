<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" width="100%" height="100%" preserveAspectRatio="xMinYMid meet">
  <defs>
    <!-- گرادیان رنگی نارنجی -->
    <linearGradient id="orangeGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#e64600"/>
      <stop offset="35%" stop-color="#f55a00"/>
      <stop offset="70%" stop-color="#ff7b00"/>
      <stop offset="100%" stop-color="#ffa600"/>
    </linearGradient>

    <!-- هایلایت و برجستگی لبه سهبعدی -->
    <linearGradient id="orangeBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.45)"/>
      <stop offset="100%" stop-color="rgba(150,35,0,0.5)"/>
    </linearGradient>
  </defs>

  <!-- مسیر وکتور با ارتفاع کامل بدنه و عرض متناسب -->
  <path d="M 165 4
           H 785
           A 110 110 0 0 1 785 224
           H 165
           C 80 224, 30 248, 2 266
           L 2 110
           C 2 50, 75 4, 165 4 Z"
        fill="url(#orangeGrad)"
        stroke="url(#orangeBorder)"
        stroke-width="1.5" />
</svg>
